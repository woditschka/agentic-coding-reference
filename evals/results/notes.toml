# Operator notes — dated commentary summarize.py renders into TREND.md.
# `task` places a note under that task's table; `version` (with `task`)
# narrows it to one cell; neither makes it page-level. `model` (with
# `task`) narrows the note's explaining power in the settled-moves check
# to one pin. Validation is loud: a note naming an unrecorded task, cell,
# or pin aborts the render. Note text
# follows the document-writing standards; the audit's docs lane reviews it.
# A new note matches the existing entries: dated, cell-scoped where the
# observation is cell-specific, mechanisms grounded in ledgers or run
# folders, figures over adjectives, relative ADR links.

[[note]]
date = 2026-08-27
text = """
Rows v0.1.1 through v0.2.1 hold era arms swept from 2026-08-22 under
the current task prompts and the era contract — the version's own
project files, entry instruction, and root model — three reps per cell
against one epoch ([re-baseline ADR](../../docs/adr/2026-08-22-re-baseline-the-old-prompt-eval-rows.md)).
The superseded 2026-08-04 to 2026-08-08 folders left the tree with the
campaign; the pre-deletion commits keep them. The 2026-08-07 prompt
clarification (each prompt decides its visible entry point and closes
with the unattended clause) therefore precedes every row on the page:
one task fingerprint end to end. The root-model row in every table is
the one condition boundary the series carries; a move across it reads
with the model condition."""

[[note]]
date = 2026-08-08
task = "visit-cancel"
text = """
Every implementing rep on record (v0.1.18 through v0.2.1) shares one
ledger-documented mechanism: the intake expert narrowed NG-4/NG-5 itself,
citing the SUT PRD's derived-from-absence hedge as license. Three changes
land after the v0.2.1 row and form a condition boundary.
Gate 1's scope-lock requires the owner's quoted decision for any
Non-Goals row change
([scope-lock ADR](../../docs/adr/2026-08-08-scope-lock-the-request-is-never-the-override.md)).
The SUT PRD confirms NG-4/NG-5 as deliberate. An unattended scope
conflict halts as a recorded consultation-request instead of an
intake decline
([resumable-pauses ADR](../../docs/adr/2026-08-08-unattended-refusals-are-resumable-pauses.md)).
A recorded refusal costs more per rep than an intake decline; that ADR
carries the figures.
A delta across this boundary measures those rules plus the firmed brief,
not model judgment. The task keeps its id; the prompt and its fingerprint
are unchanged."""

[[note]]
date = 2026-08-11
text = """
Every security review on record ran under a substituted skill. On the
plugin channel the bare security-review name in the reviewer's
frontmatter resolves to Claude Code's bundled skill of the same name,
never the harness checklist. The resolution is deterministic, so every
row whose version ships the bare name — v0.1.1 through v0.2.4, the
re-baselined rows included — ran under it; the original transcripts
(v0.1.1–v0.2.4, Claude Code 2.1.220–2.1.227) all showed the
substitution. Every affected run still appended its review-feedback
record; two ledgers record the observation (v0.2.2 owners-page-param
r1, v0.2.4 specialty-directory r3). The condition is
uniform across rows, so version comparisons stand, but no recorded
security review worked the stack checklist. The skill ships renamed
security-checks from the next version onward."""

[[note]]
date = 2026-08-13
task = "visit-edit"
version = "v0.3.0"
text = """
The cell runs 16m longer than v0.2.4 at equal depth and spends $2.01
more per pass. The growth sits in the root agent: 94–106k output
tokens per rep against v0.2.4's 51–85k, with reviewer wall spans
level. Review volume matches — 8–9 review-feedback records per run in
both arms. v0.3.0 adds the round ladder's dispatch context, which the
root relays serially (round, finding bar, recommendations). Judge
medians hold; the bar clears 3/3."""

[[note]]
date = 2026-08-15
task = "owners-page-param"
version = "v0.3.1"
text = """
Cost per pass rises $4.49 to $6.58 against v0.3.0, resolved at 5+ reps
per arm; the escalation pair cleared at that depth. The growth is two
ledger-visible mechanisms, not rework. The intake front door adds the
requirements and design stages — $1.7 and $1.3 per rep — that earlier
eval flows seeded past
([root-channel ADR](../../docs/adr/2026-08-14-the-root-is-a-channel-not-an-author.md)).
The review-plan classifies the change high and draws the four-reviewer
floor, where every v0.3.0 rep narrowed to two reviewers. The fixed cost
lands hardest on this $4.49 task; the same stages move the $17–19 tasks
by 2% or less. The bar clears 5/5; judge medians hold.

r5's doc-fit 2 is a sanitizer artifact, not a doc defect. The rep's
rewritten PRD paragraph carries `(confirmed 2026-08-14)`, and the
judge's patch filter drops whole provenance-marked lines. The judge
saw the paragraph deleted with nothing added; the committed patch
holds the full replacement. The filter needs to strip the mark token,
never the line."""

[[note]]
date = 2026-08-15
text = """
The judge's patch sanitizer now strips the inline
`(confirmed YYYY-MM-DD)` mark as a token instead of dropping its whole
line; the `> Provenance:` and `<!-- harness` lines still drop whole.
The owners-page-param v0.3.1 note records the doc-fit score the
line-drop cost. Judged rows before this date saw line-dropped patches;
rows from the next sweep onward see token-stripped ones. Rubric and
judge model are unchanged."""

[[note]]
date = 2026-08-15
task = "visit-cancel"
version = "v0.3.1"
text = """
Two of five reps refuse without the advisory consultation record
(`refused*`): each declines at intake in about a minute for $0.45–0.56,
appending no consultation-request. The inverted bar passes 5/5 either
way, and cost per pass falls $1.21 to $0.95. A consult-less refusal
leaves no resumable pause, so the recorded-pause mechanism
([resumable-pauses ADR](../../docs/adr/2026-08-08-unattended-refusals-are-resumable-pauses.md))
engaged in three of five reps."""

[[note]]
date = 2026-08-15
task = "visit-edit"
version = "v0.3.1"
text = """
The root growth the v0.3.0 note records reverses: root output falls to
a 46k-token mean per rep against v0.3.0's 94–106k, root spend $7.40 to
$5.08, wall 53m to 43m. `route` now composes each reviewer dispatch's
prompt_note and the root appends it verbatim
([root-channel ADR](../../docs/adr/2026-08-14-the-root-is-a-channel-not-an-author.md)).
The root saving scales with review traffic — largest here, 4% on the
refusal task — and offsets the front door's added stages on the large
tasks. The bar clears 3/3; judge medians hold."""

[[note]]
date = 2026-08-15
text = """
Every claude-dev-mode run recorded before 2026-08-15 — the v0.2.2
through v0.3.2 rows — executed with the plugin hooks inert: Claude Code creates `plugins/data/<plugin>` before
running a plugin hook, the container's read-only plugins share failed
that mkdir, and the hook died unrun with a non-blocking exit. The
condition is uniform across those rows, so version comparisons stand;
no recorded run had the handoff guards or the intake Stop guard
active. The launcher fixed and reinstalled 2026-08-15 mounts a private
writable overlay at `plugins/data`; hooks are active from the next
run, the re-baselined v0.1.1 through v0.2.1 rows included. Refusal-task
consultation checkpoints across this boundary measure different
machinery; the visit-cancel cells topped up 2026-09-01 (v0.2.3, v0.2.4,
v0.3.0) span it — each manifest records its side, and the Ckpt column
reads per rep."""

[[note]]
date = 2026-08-16
task = "visit-cancel"
version = "v0.3.3"
text = """
First rows past the plugin-hook boundary: all three reps refuse as
recorded consultations at $0.96–1.17, checkpoints full. The
transcripts show no EROFS and no Stop-guard block — root dispatched
the expert on the `intake-ready` reason alone, so the hook stands as
an unexercised backstop. Cost per pass rises $0.83 to $1.07 against
the v0.3.2 row's mixed declines — the recorded-pause price
([resumable-pauses ADR](../../docs/adr/2026-08-08-unattended-refusals-are-resumable-pauses.md))."""

[[note]]
date = 2026-08-16
text = """
The v0.3.3 sweep is the first with the contracts-sync gate check:
`gate_checks_run` names it in all twelve feature reps, no rep trips
its abort, and the requirement-id-absence critical — the dominant
class of the two prior sweeps — produces zero findings
([contracts-sync ADR](../../docs/adr/2026-08-15-contracts-sync-joins-the-gate.md)).
Doc-fit judge medians read 5 on all four feature tasks. Whole-sweep
agent spend falls to $50.90, below the pre-front-door v0.3.0 row's
$52.46. The vets-specialty-filter wall lengthens 47m to 61m while its
cost falls 16% — unattributed; a watch item, not a believed shift."""


[[note]]
date = 2026-08-21
task = "specialty-directory"
version = "v0.3.5"
text = """
The +33% against v0.3.3 ($12.09 to $16.12 per rep, 33 to 47
dispatches across the reps) is review-escalation churn, not a
per-dispatch cost change. Every v0.3.5 review pass classified high
(oversize, design-revision, then prior-critical). Doc-reviewer
criticals in two reps — a literal route restated in the PRD's
Done-when, the undefined noun "holder" spanning two briefs, then its
half-resolved fix — forced PRD re-entries and full-battery repeats.
r2 adds three build failures, one a truncation partial. The other
tasks moved -16% to +5%, so the sweep delta is this task's tail. One
deliberate bar-raise plausibly contributes: v0.3.4 tightened the
documentation-standards ownership clause ("a reference is a
link plus at most one orienting clause"), and both criticals sit in
exactly that class; no other commit between the tags touches review
or PRD behavior. The cost is the recorded escalation ladder firing
on real findings
([risk-proportional-review ADR](../../docs/adr/2026-07-09-risk-proportional-review.md))."""

[[note]]
date = 2026-08-27
task = "vets-specialty-filter"
version = "v0.1.18"
text = """
