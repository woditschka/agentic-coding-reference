text = """
Every implementing rep on record (v0.1.18 through v0.2.1) shares one
ledger-documented mechanism: the intake expert narrowed NG-4/NG-5 itself,
citing the SUT PRD's derived-from-absence hedge as license. Two changes
land after the v0.2.1 row and form a condition boundary
([ADR 2026-08-08](../../docs/adr/2026-08-08-scope-lock-the-request-is-never-the-override.md)).
Gate 1's scope-lock requires the owner's quoted decision for any
Non-Goals row change; the SUT PRD confirms NG-4/NG-5 as deliberate.
A delta across this boundary measures those rules plus the firmed brief,
not model judgment. The task keeps its id; the prompt and its fingerprint
are unchanged."""
