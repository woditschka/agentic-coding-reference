# Server-side mirror of the local deterministic battery (harness/verify-harness.py).
# Runs the full gate on every push to main and every pull request, then reports
# the result — a public attestation that the pushed code passed. The local
# .githooks/pre-push hook is what *prevents* an unscanned push; this workflow is
# the visible record, and it gates a merge only where branch protection requires
# this check. Both run --strict, so a missing linter (shellcheck, bandit, ruff,
# mypy) fails the gate rather than skipping it.
# See docs/adr/2026-07-13-server-side-battery-enforcement.md.
# This workflow is "checks" — file, display name, and badge label all match, the
# public-facing word for the gate. It runs the deterministic battery
# (harness/verify-harness.py); "battery" stays the internal term for that suite.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the battery only reads the tree (local git status, no fetch).
permissions:
  contents: read

jobs:
  verify-harness:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (supply-chain hardening); the comment
      # tracks the release. Bump both together via /deps-upgrade.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The battery needs no git token; do not leave it in the workspace.
          persist-credentials: false
      - name: Install the pinned linter toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # pipx is preinstalled on the runner and sidesteps PEP 668. Pins
          # mirror tools/claude-pod/Dockerfile (ruff must equal pyproject's
          # required-version — ruff refuses a mismatch); the pod-toolchain-pins
          # battery step gates the trio. Bump together via /deps-upgrade.
          pipx install "bandit==1.9.4"
          pipx install "ruff==0.15.22"
          pipx install "mypy==2.3.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The full battery under --strict: shellcheck, bandit, ruff, and mypy are
      # now present, so their steps run (a missing one would FAIL, not skip).
      # The sample doctors
      # and unit suites need only python3/bash; step 9 (real plugin install)
      # self-skips without the claude CLI. No Go/Java toolchain needed.
      - name: Run the deterministic battery
        run: harness/verify-harness.py --strict
