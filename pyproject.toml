# Root tool config for the harness Python core (ADR 2026-07-17).
# This is the ONLY pyproject.toml in the repo: the stdlib-only battery step
# (verify-harness.py 1c) forbids a dependency manifest in any shipped tree
# (harness/core, harness/stacks, harness/claude-md, samples/, plugins/), so the
# ruff + mypy config lives at the root, outside every materialized surface.
# ruff and mypy are maintainer tools only; nothing here ships to a consumer.

[tool.ruff]
# Pin the exact version the battery and the push gates format against, so a
# newer ruff reformatting differently is a loud version mismatch, not silent
# drift. Bump in lockstep with the upgrade-deps skill.
required-version = "0.15.22"
target-version = "py311"
# Formatter uses ruff defaults (double quotes, 88 cols, spaces).

[tool.ruff.lint]
# Explicit select — never "ALL". The families realize, for Python, the code
# bar the harness ships to its consumers (tdd-principles § Code That Reads
# Cold and the stack code-quality checklists): accurate names, functions at
# one level of abstraction, comments only where a name cannot carry the reason, doc
# comments that state purpose. S (bandit's security rules) is deliberately
# absent: bandit owns security findings (verify-harness 1b).
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (undefined names, unused imports)
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "N",      # pep8 naming
    "UP",     # pyupgrade (3.11+ idioms)
    "B",      # flake8-bugbear (likely bugs)
    "A",      # builtins shadowed by local names
    "ARG",    # unused arguments
    "ANN",    # annotations present; Any only at a parse boundary (noqa there)
    "BLE",    # no blind `except Exception`
    "C4",     # comprehension idioms
    "C90",    # cyclomatic complexity (threshold below)
    "D",      # doc comments: present on public names, one purpose sentence
    "DTZ",    # timezone-aware datetimes
    "ERA",    # no commented-out code
    "FBT001", # boolean parameters are keyword-only
    "FBT002",
    "FLY",    # f-string over str.join of literals
    "FURB",   # refurb modernizations
    "G",      # logging call formatting
    "ISC",    # implicit string concatenation pitfalls
    "LOG",    # logging usage
    "PERF",   # performance idioms
    "PGH",    # pygrep hooks (blanket noqa/type-ignore)
    "PIE",    # misc lints
    "PLC",    # pylint conventions
    "PLE",    # pylint errors
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments (threshold below)
    "PLR0915",  # too many statements
    "PLR2004",  # magic values are named
    "PLW",    # pylint warnings
    "PTH",    # pathlib over os.path
    "RET",    # flake8-return (return-flow clarity)
    "RSE",    # raise idioms
    "RUF",    # ruff-native rules
    "SIM",    # flake8-simplify
    "SLOT",   # __slots__ on str/tuple subclasses
    "T10",    # no debugger imports
    "TRY002", # no bare `raise Exception`
    "TRY004", # TypeError for type checks
    "TRY300", # else-branch return after try
    "TRY301", # no raise inside try
    "TRY400", # logging.exception in except
]
# Minimal ignore list — each rule is idiomatic-in-this-tree, not a defect:
ignore = [
    "E501",   # line width is the formatter's job; lint E501 also fires on
              # strings, URLs, and comments the formatter cannot wrap.
    "SIM105", # explicit try/except/pass is clearer (and faster in hot paths)
              # than contextlib.suppress here; kept deliberate.
    "SIM115", # accounting.py streams from a bare, manually managed handle
              # ("never raises" reader); a context manager changes its shape.
    "D203",   # one of each conflicting pydocstyle pair; pep257 convention
    "D213",   # settles the rest.
    "ISC001", # conflicts with the formatter.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# The stack checklists' function-design rule: four or fewer parameters, a
# record for more.
max-args = 4

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
# Keep the explicit re-export block in handoff/__init__.py as one parenthesized
# block per module rather than one `from .mod import (X as X)` statement per
# name — the composition root's public surface reads as a list, not 49 lines.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests are specifications: no narration doc comments, no annotations on test
# methods, literals judged by the three-tier rule in review, fakes with unused
# lambda parameters, imports after the sys.path setup the suites need.
"**/tests/**" = ["D", "ANN", "PLR2004", "ARG005", "PLC0415", "FBT001", "FBT002"]
"**/test_*.py" = ["D", "ANN", "PLR2004", "ARG005", "PLC0415", "FBT001", "FBT002"]
# The debt list: files still under the previous bar, one entry per file, the
# rules it fails. An entry only shrinks — a module pass deletes it; a new file
# is never added. The list is empty when every module has been passed.

[tool.mypy]
strict = true
python_version = "3.11"
# The full harness-core Python is typed (ADR 2026-07-17). The changeset,
# handoff, and grading logic are packages (ADR 2026-07-17 runtime-package-layout);
# this scope names the three package dirs, the cost overlay (accounting), and the
# doctor. Every module is annotated and mypy --strict clean, imports followed
# for real. Strict here means the annotations are complete and sound — it is
# not uniform record-type rigor: handoff carries the frozen dataclasses and
# assert_never exhaustiveness of the typed-core ADR, while grading is still
# annotated dict[str, Any] at its record boundary (typing the grading model is
# the runtime-package-layout ADR's parked follow-up). The three composition-root
# entries harness/core/scripts/handoff.py, grading.py, and changeset.py are
# DELIBERATELY absent: mypy refuses a same-named file and package in one build
# ("Duplicate module named 'handoff'"), so the battery's mypy step (verify-harness
# 1f) runs this pyproject scope first, then each entry alone.
#
# The scope also covers producer-side orchestration — the harness/*.py maintainer
# tooling that creates, installs, and validates the runtime (ADR 2026-07-17
# producer-side-typed-scope amendment). Those scripts never ship to a consumer,
# so typing them costs no consumer-facing change; they carry the grading-tier bar
# (complete, sound annotations; Any only at the tomllib/subprocess boundary), not
# handoff's record rigor. Brought in one script per tranche, foundation first
# (registry, then the consumer mutators), so the gate stays green throughout.
files = [
    "harness/core/scripts/changeset",
    "harness/core/scripts/handoff",
    "harness/core/scripts/grading",
    "harness/core/scripts/accounting.py",
    "harness/core/scripts/backlog.py",
    "harness/core/scripts/doctor.py",
    # producer-side orchestration (widening tranche by tranche):
    "harness/registry.py",
    "harness/write_guard.py",
    "harness/differential.py",
    "harness/replay-ledgers.py",
    "harness/fuzz-handoff.py",
    "harness/fuzz-grading.py",
    "harness/materialize.py",
    "harness/init.py",
    "harness/refresh-settings.py",
    "harness/refresh-gitignore.py",
    "harness/render-agent-mirrors.py",
    "harness/package-marketplace.py",
    "harness/deps-report.py",
    "harness/retired_paths.py",
    "harness/render-adr-index.py",
    "harness/marketplace/prune-retired.py",
    # The battery: the verify_harness package plus its launcher. The hyphenated
    # launcher cannot clash with the package — verify-harness.py is not a valid
    # module name (ADR 2026-07-18 check-sync-decomposition).
    "harness/verify_harness",
    "harness/verify-harness.py",
    # The eval bench: producer-side like the harness/*.py tooling, same
    # grading-tier bar (Any at the parse and subprocess boundaries).
    "evals/run_eval.py",
    "evals/summarize.py",
    "evals/render_figure.py",
    "evals/refresh_trend.py",
    # The user-level tools: the same bar, with Any at the JSON boundary of
    # the IDE preflight's MCP messages.
    "tools/claude-dev/claude_dev_config.py",
    "tools/claude-dev/claude_dev_scrub.py",
    "tools/claude-dev/ide_preflight.py",
]
