[tool.mypy]
strict = true
python_version = "3.11"
# The full harness-core Python is typed (ADR 2026-07-17). The changeset,
# handoff, and grading logic are packages (ADR 2026-07-17 runtime-package-layout);
# this scope names the three package dirs, the cost overlay (accounting), and the
# doctor. Every module is annotated and mypy --strict clean, imports followed
# for real. Strict here means the annotations are complete and sound — it is
# not uniform record-type rigor: handoff carries the frozen dataclasses and
# assert_never exhaustiveness of the typed-core ADR, while grading is still
# annotated dict[str, Any] at its record boundary (typing the grading model is
# the runtime-package-layout ADR's parked follow-up). The three composition-root
# entries harness/core/scripts/handoff.py, grading.py, and changeset.py are
# DELIBERATELY absent: mypy refuses a same-named file and package in one build
# ("Duplicate module named 'handoff'"), so the battery's mypy step (verify-harness
# 1f) runs this pyproject scope first, then each entry alone.
#
# The scope also covers producer-side orchestration — the harness/*.py maintainer
# tooling that creates, installs, and validates the runtime (ADR 2026-07-17
# producer-side-typed-scope amendment). Those scripts never ship to a consumer,
# so typing them costs no consumer-facing change; they carry the grading-tier bar
# (complete, sound annotations; Any only at the tomllib/subprocess boundary), not
# handoff's record rigor. Brought in one script per tranche, foundation first
# (registry, then the consumer mutators), so the gate stays green throughout.
files = [
    "harness/core/scripts/changeset",
    "harness/core/scripts/handoff",
    "harness/core/scripts/grading",
    "harness/core/scripts/accounting.py",
    "harness/core/scripts/backlog.py",
    "harness/core/scripts/doctor.py",
    # producer-side orchestration (widening tranche by tranche):
    "harness/registry.py",
    "harness/write_guard.py",
    "harness/differential.py",
    "harness/replay-ledgers.py",
    "harness/fuzz-handoff.py",
    "harness/fuzz-grading.py",
    "harness/materialize.py",
    "harness/init.py",
    "harness/refresh-settings.py",
    "harness/refresh-gitignore.py",
    "harness/render-agent-mirrors.py",
    "harness/package-marketplace.py",
    "harness/deps-report.py",
    "harness/retired_paths.py",
    "harness/render-adr-index.py",
    "harness/marketplace/prune-retired.py",
    # The battery: the verify_harness package plus its launcher. The hyphenated
    # launcher cannot clash with the package — verify-harness.py is not a valid
    # module name (ADR 2026-07-18 check-sync-decomposition).
    "harness/verify_harness",
    "harness/verify-harness.py",
    # The eval bench: producer-side like the harness/*.py tooling, same
    # grading-tier bar (Any at the parse and subprocess boundaries).
    "evals/run_eval.py",
    "evals/summarize.py",
    "evals/render_figure.py",
    "evals/refresh_trend.py",
]
