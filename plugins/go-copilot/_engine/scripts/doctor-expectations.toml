# doctor-expectations.toml — the machine-checkable subset of the harness-project
# API. The human-readable spec is docs/harness-project-api.md in the harness
# handbook. This manifest is harness-owned and versions with the harness;
# consumers never edit it. The engine is scripts/doctor.py.

spec_version = "0.1.0"

[project_data]
path = "scripts/layout.toml"
required_keys = ["harness.channel", "harness.spec_version"]
channel_values = ["copy", "manifest", "marketplace"]

[reviewers]
# The mandatory reviewer floor — these four gate every change and a project
# cannot drop them. scripts/layout.toml [harness] extra_reviewers ADD to this
# set; they never replace it. The doctor checks each roster reviewer (floor plus
# declared extras) has an agent body in every declared tool surface; on the
# marketplace channel only the floor ships in the plugin, so only its body
# check is skipped there — extras stay checked on every channel.
floor = ["code-quality-reviewer", "test-reviewer", "security-reviewer", "doc-reviewer"]
# Reviewer agents follow this name shape. The doctor rejects an extra_reviewers
# entry that does not match, and review-feedback.schema.json author uses the
# same pattern — so a declared reviewer's name is always record-compatible.
name_pattern = '^[a-z][a-z0-9]*(-[a-z0-9]+)*-reviewer\Z'

[reviewers.tool_dirs]
# Per-tool agent-body path for a reviewer named {name}. The doctor builds the
# expected path from the declared [harness] tools and asserts the body exists.
claude = ".claude/agents/{name}.md"
copilot = ".github/agents/{name}.agent.md"
opencode = ".opencode/agents/{name}.md"
junie = ".junie/agents/{name}.md"

[cross_doc]
# Every REQ-ID cited in `source` must be defined in `defined_in`. These two roles
# also identify the two format-gated docs, so the doctor needs no per-file flag:
#   source     = the design doc — no field/parameter tables (source is authoritative)
#   defined_in = the PRD — every REQ-ID must carry a "Done when" acceptance bullet
# The shape matches the scratch schemas' req_id pattern (^REQ-[A-Z]+-[0-9]{3}$),
# so an id the doctor accepts is always record-compatible. The engine flags
# near-miss tokens (e.g. a four-digit id) at doctor time, before the first
# pipeline append would reject them.
req_id_pattern = '\bREQ-[A-Z]+-[0-9]{3}\b'
source = "docs/system-design.md"
defined_in = "docs/prd.md"

[handbook]
# Harness-owned documents no roster file may reference. The brief is
# self-sufficient; method docs live with the harness and its reference repo,
# never with the project.
denylist = [
  "agentic-harness.md",
  "specialist-agent-workflow.md",
  "cross-tool-strategy.md",
  "adoption-guide.md",
  "glossary.md",
  "tdd-principles.md",
  "ddd-principles.md",
  "documentation-standards.md",
  "harness-project-api.md",
]

# Word budgets gate accumulation in the two docs that grow unbounded across
# slices. Words (not lines) is the metric: under the no-hard-wrap writing
# standard a paragraph is one line, so line count is blind to prose bloat, and
# parse/consumption cost tracks words. The count strips HTML comments (template
# boilerplate) and matches `wc -w` otherwise. A project with genuine scale raises
# the ceiling via the budget_override_key in layout.toml [harness] — a recorded,
# reviewable decision, never a silent drift. The ceilings are a backstop; the
# per-contract discipline in the document-writing skill is the primary lever.

[[file]]
path = "docs/prd.md"
kind = "stub"
owner = "product-requirements-expert"
template = "templates/prd.md"
required_sections = ["Goals", "Non-Goals", "Requirements"]
max_words = 18000
budget_override_key = "harness.prd_max_words"

[[file]]
path = "docs/system-design.md"
kind = "stub"
owner = "system-design-expert"
template = "templates/system-design.md"
required_sections = ["Package Structure", "Dependency Policy", "Threat Model"]
max_words = 12000
budget_override_key = "harness.system_design_max_words"

[[file]]
path = "docs/adr"
kind = "stub"
owner = "system-design-expert"
template = "templates/adr-README.md"
materialize_to = "docs/adr/README.md"
directory = true
entry_pattern = '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md$'

[[file]]
path = "docs/ubiquitous-language.md"
kind = "stub"
# Written by the requirements expert as terms resolve; seeded once by the
# system-design expert under the foundational triage verdict.
owner = "product-requirements-expert"
template = "templates/ubiquitous-language.md"
required_sections = ["Domain Terms"]

[[file]]
path = "docs/testing-principles.md"
kind = "default"
owner = "test-reviewer"
template = "templates/testing-principles.md"
required_sections = ["Test Pyramid", "Mocking Policy", "Test Naming", "Coverage"]

  [[file.slots]]
  section = "Test Pyramid"
  must_match = '[0-9]{1,3}\s*%'

  [[file.slots]]
  section = "Coverage"
  must_match = '[0-9]{1,3}\s*%'

[[file]]
path = "docs/architecture-principles.md"
kind = "default"
owner = "system-design-expert"
template = "templates/architecture-principles.md"
required_sections = ["Module Boundaries", "Domain Core", "Pattern Catalog", "Naming"]

[[file]]
path = "docs/security-principles.md"
kind = "default"
owner = "security-reviewer"
template = "templates/security-principles.md"
required_sections = ["Trust Boundaries"]
