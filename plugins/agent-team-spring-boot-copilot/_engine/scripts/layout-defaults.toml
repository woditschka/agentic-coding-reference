# Stack defaults under scripts/layout.toml — harness-owned, replaced on every
# materialize or plugin upgrade, never edited in a project. The engine merges
# each table here under the project's layout.toml key by key: a key the
# project declares wins, an absent key reads this default. Stack syntax lives
# here once, so a project's layout never restates it and never falls behind.

[review]
# Security-surface probe: regexes matched against the added and removed
# production lines of a change. A hit keeps the security reviewer on a high plan and on a
# planner-resolved gray plan; an empty list keeps it on every such plan.
security_surface = [
    '@(?:Get|Post|Put|Delete|Patch|Request)Mapping',
    '@(?:RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute)',
    'HttpServletRequest|HttpServletResponse|WebRequest',
    '@Query\(|createQuery|createNativeQuery|jdbcTemplate|EntityManager',
    'Runtime\.getRuntime|ProcessBuilder',
    'new File\(|Paths\.get\(|Files\.|FileInputStream|FileOutputStream',
    '@PreAuthorize|@Secured|SecurityFilterChain|permitAll|csrf|CorsConfiguration',
    'ObjectMapper|readValue\(|XMLInputFactory|DocumentBuilderFactory',
    'RestTemplate|WebClient|HttpClient|URL\(|URI\.create',
    # templates and properties classify as production under src/main/
    'th:utext|th:inline|\[\(\$\{|<script|th:onclick|th:src|th:href',
    'spring\.security\.|server\.ssl\.|management\.endpoints\.|spring\.datasource\.|cors|csrf',
]

# Syntax the conventions map (grading.py conventions-map) reads: comment
# openers, the raw-construction shape in a test, framework types the map
# skips, and the shape of a named-value declaration. A walk aid, never a gate.
[conventions]
comment_markers = ["//", "/*", "*", "*/"]
construction = 'new\s+[A-Z][A-Za-z0-9_]*\s*[<(]'
construction_ignore = ['new\s+(?:PageImpl|BigDecimal|ArrayList|HashMap|HashSet|LinkedList|StringBuilder|Object|Date|File|URI|URL)\b']
constant_declaration = '\bstatic\s+final\b|\b[A-Z][A-Z0-9_]{2,}\s*='
