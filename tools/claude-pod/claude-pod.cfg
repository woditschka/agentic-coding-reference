# claude-pod.cfg — your default confinement policy (sourced as a shell snippet).
# Location: ~/.config/claude-pod/claude-pod.cfg  (or ~/claude-pod.cfg). CLI flags override it.
# shellcheck shell=bash disable=SC2034  # RW/RO/NET/CONTEXT are consumed by claude-pod after it sources this file

# Docker context — which engine runs the pod (env CLAUDE_POD_CONTEXT and the
# --context flag override this; the target engine is Rancher Desktop):
#   "auto"             rancher-desktop when that context exists, else the ambient
#                      engine — reaches Rancher Desktop on every platform, so this
#                      is the default and the way to "prefer Rancher" portably
#   "rancher-desktop"  hard-pin the named context; fails where it does not exist
#                      (WSL2 distros, admin-access Rancher, Docker Desktop/Engine)
#   ""                 ambient engine (Docker Engine, Docker Desktop, Rancher via
#                      WSL integration)
CONTEXT="auto"

# Extra WRITABLE directories (the current working directory is always writable):
# RW=( "$HOME/work/shared-lib" )

# READ-ONLY directories mounted into the jail:
# RO=( "$HOME/reference-repo" )

# Network:  "on" = default (needed to reach the Claude API)   "none" = offline
NET="on"
