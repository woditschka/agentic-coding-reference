# Per-project file-classification rules for score-change.py.
#
# EDIT THIS FILE TO MATCH YOUR PROJECT'S LAYOUT.
#
# This is the one file that forks per project; the engine (score-change.py)
# ships unchanged. The rules below are plain data — globs and module-derivation
# strategies — consumed by the engine's classifier. The defaults are for this Go
# repository. A TypeScript or Java repo keeps its own copy with its own globs.
# It is read by the stdlib `tomllib` (Python 3.11+), so the engine stays
# dependency-free.
#
# Classification contract (enforced by the engine, documented in the
# change-grading skill):
#
# - A changed file is matched against these rules to get one *kind* and one
#   *module*.
# - Precedence: a file matching a `test` glob is a test file even if it also
#   sits under a `prod_roots` prefix (test wins). `sensitive` is an independent
#   overlay flag, not a kind.
# - A file matching no `test` and no `prod_roots` glob is kind "unknown" —
#   recorded, never silently dropped, never treated as prod. Unknown flows to
#   concern in the grader. Absence of a positive classification is not evidence
#   of safety.
#
# Globs use fnmatch semantics with '/' significant; '**' matches across
# directories. Keep the lists short and the patterns specific.

# Files whose changes are test code (green-suite evidence, not production risk).
# Patterns are matched with fnmatch, where '**/' requires at least one parent
# directory; include a top-level variant when a kind can appear at the repo root.
test = [
    "**/*_test.go",
    "*_test.go",
]

# Roots under which a changed file is production source.
prod_roots = [
    "internal/",
    "cmd/",
    "pkg/",
]

# Risk pointers: paths the grader should read most closely. This is only a
# *map* for the grader, never a verdict — a miss here does not make a change
# safe, it just fails to point. Extend in the shared engine's spirit (helps
# every project) when a recurring sensitive area is unlabeled. As with `test`,
# a '**/x/**' pattern requires x to have a parent directory; add a top-level
# 'x/**' variant if sensitive code can live at the repo root.
sensitive = [
    "**/auth/**",
    "**/secret*/**",
    "**/cred*/**",
    "**/*key*/**",
    "**/*token*/**",
]

# Module-derivation rules: ordered, first match wins. Each entry pairs a path
# glob (`match`) with a strategy (`from`) that extracts the module identity from
# the path. The module id keeps its path prefix, so a change spanning two stacks
# reads as wider scatter without a language tag. A file matching no rule yields
# module=None: it is excluded from the scatter count but still recorded as a
# file with its own kind.
#
# Strategies the engine implements:
#   "dir"                           -> the file's parent directory (Go package path)
#   "first-segment-after:<prefix>/" -> <prefix> plus the first segment after it; the
#                                      prefix is kept in the id (packages/ -> "packages/ui")
#   "maven"                         -> the package root for a Maven/Gradle src layout
[[module]]
match = "internal/**"
from = "dir"

[[module]]
match = "cmd/**"
from = "dir"

[[module]]
match = "pkg/**"
from = "dir"
