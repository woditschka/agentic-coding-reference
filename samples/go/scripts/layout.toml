# Per-project file-classification rules for score-change.py.
#
# EDIT THIS FILE TO MATCH YOUR PROJECT'S LAYOUT.
#
# This is the one file that forks per project; the engine (score-change.py)
# ships unchanged. The rules below are plain data — globs and module-derivation
# strategies — consumed by the engine's classifier. The defaults are for this Go
# repository. A TypeScript or Java repo keeps its own copy with its own globs.
# It is read by the stdlib `tomllib` (Python 3.11+), so the engine stays
# dependency-free.
#
# Classification contract (enforced by the engine, documented in the
# change-grading skill):
#
# - A changed file is matched against these rules to get one *kind* and one
#   *module*.
# - Precedence: a file matching a `test` glob is a test file even if it also
#   sits under a `prod_roots` prefix (test wins). `sensitive` is an independent
#   overlay flag, not a kind.
# - A file matching no `test` and no `prod_roots` glob is kind "unknown" —
#   recorded, never silently dropped, never treated as prod. Unknown flows to
#   concern in the grader. Absence of a positive classification is not evidence
#   of safety.
#
# Globs use fnmatch semantics with '/' significant; '**' matches across
# directories. Keep the lists short and the patterns specific.

# Files whose changes are test code (green-suite evidence, not production risk).
# Patterns are matched with fnmatch, where '**/' requires at least one parent
# directory; include a top-level variant when a kind can appear at the repo root.
test = [
    "**/*_test.go",
    "*_test.go",
]

# Framework floor for test function names. Engines and handoff validation
# match `test_names` entries against this pattern. The naming *school*
# (behavior-as-specification, BDD style) lives in docs/testing-principles.md;
# this regex is only the machine-checkable floor the framework imposes.
test_name_pattern = '^Test[A-Z]'

# Roots under which a changed file is production source.
prod_roots = [
    "internal/",
    "cmd/",
    "pkg/",
]

# Risk pointers: paths the grader should read most closely. This is only a
# *map* for the grader, never a verdict — a miss here does not make a change
# safe, it just fails to point. Extend in the shared engine's spirit (helps
# every project) when a recurring sensitive area is unlabeled. As with `test`,
# a '**/x/**' pattern requires x to have a parent directory; add a top-level
# 'x/**' variant if sensitive code can live at the repo root.
sensitive = [
    "**/auth/**",
    "**/secret*/**",
    "**/cred*/**",
    "**/*key*/**",
    "**/*token*/**",
]

# Paths to drop from the change set under review, on top of .gitignore. The
# reviewer roster and the change-grader both read the change set through
# scripts/changeset.sh, which excludes these globs — use it for tracked-but-
# irrelevant trees (vendored code, generated-yet-committed files) that would
# otherwise add review noise. Excluding source hides it from review, so keep
# this list narrow. Default empty: the change set is the whole diff.
exclude_globs = []

# Harness identity: which distribution channel installed this harness and
# which harness-project API revision the docs/ roster conforms to. Read by
# the doctor (brief_doctor.py) to pick channel-specific invariants.
[harness]
# Distribution channel for the harness runtime. "copy" (default) commits the
# runtime into this repo — self-contained, version-controlled, diffable. "manifest"
# materializes it from /harness gitignored, kept untracked by the doctor. Switching
# is manual (see the root README "Distribution channels" section); /materialize
# respects whatever is declared here and never flips it.
channel = "copy"
spec_version = "0.1.0"
# Tool surfaces installed (claude is always on; copilot, opencode, junie optional).
# materialize installs only these and never adds one on upgrade. Re-run /materialize
# after editing.
tools = ["claude", "copilot", "opencode", "junie"]
# Project-owned skills/agents kept in the runtime tree — /materialize never prunes
# them and the doctor excludes them from the untracked-runtime check. /materialize
# adds an entry when it finds a skill the harness does not own.
extensions = []
# Extra reviewers (additive). The four-reviewer floor — code-quality, test,
# security, doc — always gates and cannot be dropped. Names here ADD to that
# floor: each must have an agent body in every tool surface above and be listed
# in `extensions` so /materialize keeps it across upgrades. The coordinator gate
# waits on the floor plus every name here. Reviewers are named `*-reviewer`.
extra_reviewers = []

# Change grading: whether the pipeline auto-dispatches the terminal, advisory
# change-grader once the roster approves. The grader judges how much human
# attention a passing change deserves before merge; it never gates the merge and
# nothing routes on its verdict. true (default) runs it automatically. false
# skips it in the pipeline — the feature is complete on roster approval, and you
# can still run the grader by hand via the change-grading skill. Absent or
# non-boolean reads as true, so an upgrade keeps grading on unless you opt out.
auto_grade = true

# Risk-proportional review.
# Optional: an absent [review] table uses the engine defaults below, so the
# pipeline runs risk-proportional review out of the box. score-change.py
# review-plan classifies each change and either buys a surface-matched roster
# (docs-only -> doc-reviewer; small clean prod -> the planner judges) or fails
# closed to the full four-reviewer battery. The floor never shrinks — a plan
# only narrows which floor reviewers run on a given pass, never removes one from
# the roster the doctor enforces.
[review]
# Full-battery opt-out. "risk" (default) runs the risk ladder. "always-full"
# reproduces pre-plan behavior: every pass dispatches the whole roster.
mode = "risk"
# The combined prod+test changed-line ceiling for a "low"/"gray" plan. A change
# above this is "high" — the full battery. Raise it for a codebase whose small
# changes are routinely larger; keep it well below a slice's typical size.
size_threshold = 80
# Review-surface globs. A changed file matching `docs` reviews as documentation
# (doc-reviewer); one matching `config` reviews as data/config (code-quality +
# security). fnmatch semantics, '*' crosses '/'. Anything matching neither these
# nor test/prod_roots is "unknown" — which trips the full battery, never a
# silent skip. Keep `config` to data-file extensions; a `config/**` directory
# rule would misclassify production code that lives under it.
docs = ["**/*.md", "*.md", "docs/**"]
config = ["**/*.toml", "*.toml", "**/*.yaml", "*.yaml", "**/*.yml", "*.yml", "**/*.json", "*.json"]

# Optional surface→reviewer override: which roster reviewers a focused first
# pass draws per surface (docs/test/config; a production change never takes
# the surface path, so prod is not overridable). Names must be roster members
# (the floor plus declared extras). A malformed table fails the plan loudly;
# route then falls closed to the full battery. Uncomment to override a surface:
# [review.surface_reviewers]
# docs = ["doc-reviewer"]
# config = ["code-quality-reviewer", "security-reviewer"]

# Module-derivation rules: ordered, first match wins. Each entry pairs a path
# glob (`match`) with a strategy (`from`) that extracts the module identity from
# the path. The module id keeps its path prefix, so a change spanning two stacks
# reads as wider scatter without a language tag. A file matching no rule yields
# module=None: it is excluded from the scatter count but still recorded as a
# file with its own kind.
#
# Strategies the engine implements:
#   "dir"                           -> the file's parent directory (Go package path)
#   "first-segment-after:<prefix>/" -> <prefix> plus the first segment after it; the
#                                      prefix is kept in the id (packages/ -> "packages/ui")
#   "maven"                         -> the package root for a Maven/Gradle src layout
[[module]]
match = "internal/**"
from = "dir"

[[module]]
match = "cmd/**"
from = "dir"

[[module]]
match = "pkg/**"
from = "dir"
