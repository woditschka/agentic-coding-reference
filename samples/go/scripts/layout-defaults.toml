# Stack defaults under scripts/layout.toml — harness-owned, replaced on every
# materialize or plugin upgrade, never edited in a project. The engine merges
# each table here under the project's layout.toml key by key: a key the
# project declares wins, an absent key reads this default. Stack syntax lives
# here once, so a project's layout never restates it and never falls behind.

[review]
# Security-surface probe: regexes matched against the added production lines
# of a change. A hit keeps the security reviewer on a high plan and on a
# planner-resolved gray plan; an empty list keeps it on every such plan.
security_surface = [
    'HandleFunc\(|http\.Handle|\.Handle\(|\.Get\(|\.Post\(|ServeHTTP',
    'r\.URL\.Query|r\.FormValue|r\.Body|r\.Header|mux\.Vars|PathValue\(',
    'sql\.|\.Query\(|\.QueryRow\(|\.Exec\(',
    'exec\.Command|os/exec',
    'os\.Open|os\.ReadFile|os\.WriteFile|os\.Create|filepath\.Join',
    'crypto/|tls\.|x509\.|jwt',
    'json\.Unmarshal|xml\.Unmarshal|yaml\.Unmarshal|gob\.',
    'http\.Get\(|http\.Post\(|http\.NewRequest|url\.Parse',
]

# Syntax the conventions map (grading.py conventions-map) reads: comment
# openers, the raw-construction shape in a test (a composite literal of an
# exported type), and the shape of a named-value declaration. A walk aid,
# never a gate.
[conventions]
comment_markers = ["//", "/*", "*/"]
construction = '\b[A-Z][A-Za-z0-9_]*\{'
construction_ignore = ['\b(?:Config|Options)\{']
constant_declaration = '\bconst\b|\b[A-Z][A-Z0-9_]{2,}\s*='
