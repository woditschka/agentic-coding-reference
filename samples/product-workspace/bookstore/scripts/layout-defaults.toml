# Stack defaults under scripts/layout.toml — harness-owned, replaced on every
# materialize or plugin upgrade, never edited in a project. The engine merges
# each table here under the project's layout.toml key by key: a key the
# project declares wins, an absent key reads this default. Stack syntax lives
# here once, so a project's layout never restates it and never falls behind.

[review]
# No stack syntax is known here: an empty probe keeps the security reviewer
# on every high and gray plan (fail closed) until the project's layout.toml
# declares one.
security_surface = []

# Generic comment and named-value syntax. The raw-construction shape is the
# project's to declare in layout.toml [conventions]; absent, the map lists no
# constructions.
[conventions]
comment_markers = ["//", "#", "/*", "*", "*/", "--"]
constant_declaration = '\bconst\b|\bstatic\s+final\b|\b[A-Z][A-Z0-9_]{2,}\s*='
