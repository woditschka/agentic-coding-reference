# Per-project file-classification rules for score-change.py.
#
# EDIT THIS FILE TO MATCH YOUR PROJECT'S LAYOUT.
#
# This is the generic stack: the defaults below are placeholders, not a working
# layout. Replace the {{FILL}} values and example globs with your project's real
# test patterns, production roots, and module-derivation rules. The engine
# (score-change.py) ships unchanged; only this data forks per project. It is
# read by the stdlib `tomllib` (Python 3.11+), so the engine stays
# dependency-free.
#
# Classification contract (enforced by the engine, documented in the
# change-grading skill):
#
# - A changed file is matched against these rules to get one *kind* and one
#   *module*.
# - Precedence: a file matching a `test` glob is a test file even if it also
#   sits under a `prod_roots` prefix (test wins). `sensitive` is an independent
#   overlay flag, not a kind.
# - A file matching no `test` and no `prod_roots` glob is kind "unknown" —
#   recorded, never silently dropped, never treated as prod. Unknown flows to
#   concern in the grader. Absence of a positive classification is not evidence
#   of safety.
#
# Globs use fnmatch semantics with '/' significant; '**' matches across
# directories. Keep the lists short and the patterns specific.

# Files whose changes are test code (green-suite evidence, not production risk).
# {{FILL}} — replace with this stack's test-file conventions. The defaults are a
# broad starting heuristic; tighten them to your real layout.
test = [
    "**/*test*",
    "**/*spec*",
]

# Framework floor for test function names. Engines and handoff validation match
# `test_names` entries against this pattern. The naming *school* lives in
# docs/testing-principles.md; this regex is only the machine-checkable floor.
# {{FILL}} — set to your framework's required test-name shape. The default
# accepts any non-empty name; tighten it once the framework is chosen.
test_name_pattern = '^.+$'

# Roots under which a changed file is production source.
# {{FILL}} — replace with this project's real production source roots.
prod_roots = [
    "src/",
]

# Risk pointers: paths the grader should read most closely. This is only a *map*
# for the grader, never a verdict — a miss here does not make a change safe, it
# just fails to point. These defaults are language-agnostic; extend them when a
# recurring sensitive area is unlabeled.
sensitive = [
    "**/auth/**",
    "**/secret*/**",
    "**/cred*/**",
    "**/*key*/**",
    "**/*token*/**",
]

# Paths to drop from the change set under review, on top of .gitignore. The
# reviewer roster and the change-grader both read the change set through
# scripts/changeset.sh, which excludes these globs — use it for tracked-but-
# irrelevant trees (vendored code, generated-yet-committed files) that would
# otherwise add review noise. Excluding source hides it from review, so keep
# this list narrow. Default empty: the change set is the whole diff.
exclude_globs = []

# Harness identity: which distribution channel installed this harness and which
# harness-project API revision the docs/ roster conforms to. Read by the doctor
# (brief_doctor.py) to pick channel-specific invariants.
[harness]
# Distribution channel for the harness runtime. "copy" (default) commits the
# runtime into this repo. "manifest" materializes it from /harness gitignored.
# Switching is manual (see the root README "Distribution channels" section);
# /materialize respects whatever is declared here and never flips it.
channel = "copy"
spec_version = "0.1.0"
# Tool surfaces installed (claude is always on; copilot, opencode, junie optional).
tools = ["claude", "copilot", "opencode", "junie"]
# Project-owned skills/agents kept in the runtime tree — /materialize never prunes
# them and the doctor excludes them from the untracked-runtime check.
extensions = []
# Extra reviewers (additive). The four-reviewer floor — code-quality, test,
# security, doc — always gates and cannot be dropped. Names here ADD to that
# floor: each must have an agent body in every tool surface above and be listed
# in `extensions` so /materialize keeps it across upgrades. The coordinator gate
# waits on the floor plus every name here. Reviewers are named `*-reviewer`.
extra_reviewers = []

# Module-derivation rules: ordered, first match wins. Each entry pairs a path
# glob (`match`) with a strategy (`from`) that extracts the module identity.
# A file matching no rule yields module=None: excluded from the scatter count
# but still recorded as a file with its own kind.
#
# Strategies the engine implements:
#   "dir"                           -> the file's parent directory
#   "first-segment-after:<prefix>/" -> <prefix> plus the first segment after it
#   "maven"                         -> the source root for a nested src-tree layout
#
# {{FILL}} — replace with this project's real module mapping.
[[module]]
match = "src/**"
from = "dir"
